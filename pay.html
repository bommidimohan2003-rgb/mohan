<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Razorpay Payment Integration</title>
  <style>
    /* Reset */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #74ebd5, #ACB6E5);
    }

    .container {
      background: #fff;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
      text-align: center;
      width: 350px;
      animation: fadeIn 0.8s ease-in-out;
    }

    h2 {
      margin-bottom: 20px;
      color: #333;
      font-size: 22px;
    }

    button {
      background: #3399cc;
      color: #fff;
      border: none;
      padding: 12px 25px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    button:hover {
      background: #2678a7;
      transform: scale(1.05);
    }

    /* Animation */
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Pay ₹500 using Razorpay</h2>
    <button id="payBtn">Pay Now</button>
  </div>

  <!-- Razorpay checkout script -->
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script>
    document.getElementById("payBtn").onclick = async function () {
      try {
        // Step 1: Create order from backend
        const order = await fetch("http://localhost:5000/create-order", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ amount: 500 }) // Amount in INR
        }).then(res => res.json());

        if (!order.id) {
          alert("❌ Failed to create order. Check backend logs.");
          return;
        }

        // Step 2: Open Razorpay checkout
        var options = {
          "key": "YOUR_KEY_ID", // Replace with Razorpay Test Key ID
          "amount": order.amount, 
          "currency": order.currency,
          "name": "My Website",
          "description": "Test Transaction",
          "order_id": order.id,
          "handler": async function (response) {
            // Step 3: Verify payment with backend
            const verify = await fetch("http://localhost:5000/verify-payment", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(response)
            }).then(res => res.json());

            if (verify.success) {
              alert("✅ Payment successful! " + verify.message);
            } else {
              alert("❌ Payment failed! " + verify.message);
            }
          },
          "prefill": {
            "name": "Mohan",
            "email": "bommidimohan2003@gmail.com",
            "contact": "7989002612"
          },
          "theme": { "color": "#3399cc" }
        };

        var rzp1 = new Razorpay(options);
        rzp1.open();

      } catch (error) {
        console.error("Frontend error:", error);
        alert("Something went wrong. Check console.");
      }
    }
  </script>
</body>
</html>
